# Logitech F310 / F710 with the back switch on X (XInput, kernel xpad driver).
# SDL/joy numbering: buttons 0 A,1 B,2 X,3 Y,4 LB,5 RB,6 Back,7 Start;
# axes 0 LX,1 LY,2 LT(rests +1),3 RX,4 RY,5 RT. So steering = axis 3, not 2.
# Auto-selected by bringup_launch.py when the pad name contains 'Logitech Gamepad F'.
joy:
  ros__parameters:
    # device_name: /dev/input/joypad-f710
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

joy_teleop:
  ros__parameters:
    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [4]
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 5.0
          offset: 0.0
        drive-steering_angle:
          axis: 3
          scale: 0.34
          offset: 0.0

    autonomous_control:
      type: topic
      interface_type: std_msgs/msg/Int8
      topic_name: /dev/null
      deadman_buttons: [5]
      message_value:
        data:
          value: 0
