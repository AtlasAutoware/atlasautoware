/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # 3575 = 60 * FDR(10.2) * pole_pairs(2) / (pi * tire_dia 0.109 m).
    # Castle 1415 is 4-pole like the Velineon, so unchanged by the motor swap.
    # Only used by vesc_to_odom (odometry) and control_mode 'speed' - NOT by 'erpm' mode.
    # Verify: drive a measured 5 m and compare /odom. Was 4614 (f1tenth reference car).
    speed_to_erpm_gain: 3575.0
    speed_to_erpm_offset: 0.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.5923

    # --- motor command mode (ackermann_to_vesc) ---
    # "erpm"    : closed-loop SPEED with a floor (min_erpm..max_erpm). Any throttle spins the
    #             wheels fast enough to carry over obstacles; never sits in the low-speed stall
    #             zone that overheats the motor (locked-rotor -> smoke). RECOMMENDED.
    # "current" : direct torque. Good launch feel, but a caught wheel = locked rotor at full
    #             current -> overheats. Don't use on surfaces where the wheels can snag.
    # "speed"   : legacy raw eRPM = gain * speed (has the low-speed stiction dead zone).
    control_mode: "erpm"
    max_speed: 5.0          # m/s at full stick (must match joy_teleop drive-speed scale)
    # erpm-mode mapping (eRPM, not m/s):
    min_erpm: 3000.0        # eRPM at the first bit of throttle  (~0.65 m/s at the wheel)
    max_erpm: 10000.0       # eRPM at full throttle               (~2.2 m/s at the wheel)
    erpm_deadband: 0.05     # |stick| below this -> 0 eRPM (coast)
    # current-mode params (only used if control_mode: current) -- reduced after smoke:
    max_current: 25.0       # was 45; lowered to limit stall heating
    min_current: 8.0
    brake_current: 12.0
    current_deadband: 0.05

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    # NOTE: in erpm mode the motor current is bound by the VESC FIRMWARE limit (l_current_max),
    # not by these ROS clips. Lower l_current_max in VESC Tool (e.g. 25-30 A) for stall/smoke
    # protection -- that is the only thing limiting current when the wheel is caught.
    current_min: -30.0
    current_max: 30.0       # was 50; ROS clip for current-mode commands
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -23250.0
    speed_max: 23250.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.90   # was 0.85; center offset 0.5304 sits right of mid, so right throw
                      # clipped early (0.26 rad vs 0.31 left). 0.90 -> ~0.30 rad, symmetric.
                      # Raise toward 0.91 for exact symmetry; lower if the servo binds at full right.

# No longer needed, all parameters are shared
# ackermann_to_vesc_node:
#   ros__parameters:

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    # Traxxas Slash 4x4 wheelbase: 12.75 in = 0.324 m (the 0.25 here was wrong and biased odometry)
    wheelbase: 0.324

# No longer needed, all parameters are shared
# vesc_driver:
#   ros__parameters:

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position

    # servo smoother - limits acceleration and smooths anything above limit
    max_acceleration: 2.5 # meters/second^2
    throttle_smoother_rate: 75.0 # messages/sec
    # servo smoother - limits rotation speed and smooths anything above limit
    max_servo_speed: 3.2 # radians/second
    servo_smoother_rate: 75.0 # messages/sec