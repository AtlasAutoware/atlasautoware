slam_toolbox:
  ros__parameters:
    # frames match the car's TF tree (vesc_to_odom publishes odom->base_link)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping                       # localization mode needs a serialized posegraph
    resolution: 0.05
    max_laser_range: 16.0               # RPLIDAR C1
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    transform_publish_period: 0.02      # 50 Hz map->odom
    map_update_interval: 1.0
    throttle_scans: 1
    use_scan_matching: true
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    debug_logging: false
