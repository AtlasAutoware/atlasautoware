# Hardware bringup parameters — the real car (Jetson + OAK-D Pro + RPLidar +
# VESC, actuated via PCA9685 PWM or direct VESC UART, auto-detected).
# Launched by launch/car_bringup_launch.py.  Calibrate before first drive:
# see docs/hardware.md.

drive_node:
  ros__parameters:
    drive_topic: '/drive'
    backend: 'auto'             # auto | pca9685 | vesc — auto probes both
    # shared actuation calibration
    max_speed: 7.0              # m/s at full throttle (start LOW, e.g. 2.0)
    max_steer: 0.36             # rad at full servo throw (Traxxas Slash linkage;
                                # 0.41 overdrives the servo into the stops)
    steer_invert: false
    steer_trim_us: 0.0          # pulse offset to drive straight
    cmd_timeout: 0.5            # s without /drive -> neutral
    arm_time: 2.0               # s of neutral at startup (ESC arming)
    # pca9685 backend (throttle pulse -> VESC PPM input)
    i2c_bus: 1                  # Jetson header i2c bus — check `i2cdetect -l`
    i2c_address: 0x40
    pwm_hz: 50.0
    throttle_channel: 0
    steer_channel: 1            # -1 if there is no separate steering servo
    neutral_us: 1500.0
    full_fwd_us: 2000.0
    full_rev_us: 1000.0
    steer_center_us: 1500.0
    steer_half_range_us: 400.0
    # vesc-uart backend (direct serial; also publishes wheel-speed odom)
    serial_port: '/dev/sensors/vesc'   # udev symlink (0483:5740) -> ttyACM*, stable across replugs
    serial_baud: 115200
    erpm_gain: 3575.0           # erpm per m/s = 60*FDR(10.2)*pole_pairs(2)/(pi*0.109 m tire); Castle 1415 4-pole
                                # Calibrate: command 2.0 m/s, measure true speed over 5 m,
                                # scale gain until they match (wrong gain = wrong speed
                                # scaling AND wrong odometry).
    # motor command mode — mirrors f1tenth_stack/config/vesc.yaml so self-driving
    # launches like the manual joystick path instead of stalling under the RPM
    # loop's low-speed stiction dead zone (~30-35 A).
    #   'current': planner speed -> motor current (instant torque off the line)
    #   'speed'  : SET_RPM closed-loop (accurate m/s tracking at racing pace; the
    #              old behavior). Switch back for high-speed MPC laps if you want
    #              the planner's speed profile tracked exactly.
    control_mode: 'current'
    max_current: 45.0           # A at full-speed cmd (FSESC 6.7 firmware l_current_max = 60, set 2026-09-02)
    min_current: 10.0           # A feed-forward to break stiction off the line
    brake_current: 15.0         # A brake when ~zero speed requested (regen lim 30)
    current_deadband: 0.05      # |speed/max_speed| below this -> brake
    odom_topic: '/vesc/odom'
    odom_frame: 'odom'
    base_frame: 'base_link'
    telemetry_hz: 20.0

rplidar_node:
  ros__parameters:
    port: '/dev/sensors/rplidar'  # stable udev symlink (CP210x 10c4:ea60); not volatile ttyUSB0
    baudrate: 460800            # RPLIDAR C1 = 460800 (A1/A2: 115200, A3/S1: 256000)
    scan_topic: '/scan'
    frame_id: 'laser'
    num_bins: 720
    range_min: 0.10
    range_max: 25.0
    angle_offset: 0.0           # rad CCW, mounting yaw correction
    deskew_odom_topic: '/ekf/odom'  # per-beam motion correction; '' = off

velocity_ekf:
  ros__parameters:
    imu_topic: '/oakd/imu'      # Orbbec backend: /camera/gyro_accel/sample remapped here by car_bringup_launch.py
    wheel_odom_topic: '/vesc/odom'  # only published by the vesc-uart backend
    out_topic: '/ekf/odom'
    l_r: 0.17145                # m, CG to rear axle

# Camera on the car is an Orbbec Gemini 335 (camera_backend:=orbbec, the default).
# Its driver is launched + remapped in launch/car_bringup_launch.py (official
# orbbec_camera node: 640x480@30 color, accel+gyro 200 Hz synced, depth off unless
# use_depth:=true). The oakd_camera params below only apply to camera_backend:=oakd.
oakd_camera:
  ros__parameters:
    width: 640
    height: 360
    fps: 30.0
    imu_hz: 200
    rgb_topic: '/oakd/rgb'
    info_topic: '/oakd/camera_info'
    imu_topic: '/oakd/imu'
    camera_frame: 'oakd_rgb'
    imu_frame: 'oakd_imu'
    yolo_blob: ''               # compiled .blob -> YOLO on the camera's VPU
    yolo_conf: 0.4              # (blobconverter from the trained ONNX)
    yolo_size: 416

camera_perception:
  ros__parameters:
    image_topic: '/oakd/rgb'
    odom_topic: '/pf/pose/odom'
    backend: 'auto'             # auto | tensorrt | onnxruntime | cuda | cpu — auto prefers a
                                # .engine built on the Jetson (trtexec --fp16), then
                                # onnxruntime (CPU; what runs today), then cv2.dnn
    img_size: 416               # models/car_yolov8.onnx is exported at 416 for the CPU path;
                                # models/car_yolov8_640.onnx is the 640 export for TensorRT
    fx: 460.5                   # Orbbec Gemini 335 color @640x480 (from /oakd/camera_info)
    cx: 326.4
    car_width: 0.30             # m, F1TENTH car incl. tires; sets range from box width
    conf: 0.50                  # raised from 0.35: fewer close-range false positives
    min_range: 0.8              # m; drop detections implying a car closer than this (lidar owns <0.8 m)
    max_box_frac: 0.6           # drop boxes wider than 60% of the frame (hands, faces)

raceline_mpc:
  ros__parameters:
    scan_topic: '/scan'
    odom_topic: '/pf/pose/odom' # map-frame pose from your localization
    drive_topic: '/drive'
    imu_topic: '/oakd/imu'      # enables the traction governor
    actuation_delay: 0.10       # s sensor->actuator latency (measure on YOUR car:
                                # step-steer test, lidar timestamp vs yaw-rate onset)
    max_lat_accel: 6.0          # m/s^2 grip budget (governor + profiler)
    aeb_decel: 6.0              # m/s^2 assumed braking for dynamic AEB range
    refine_corridor: 0.0        # m min-curvature refinement; 0 = off.  Enable
                                # (start 0.15) only after checking wall clearance
    reprofile_speeds: true      # friction-limited speeds from curvature at load
    profile_a_accel: 6.0        # m/s^2 engine limit (sensored motor: full smooth
                                # torque from 0 rpm + FSESC 6.7 current headroom)
    profile_a_brake: 8.0        # m/s^2 braking limit (VESC 6 regen current)
    profile_v_max: 8.0          # m/s profile ceiling
    v_scale: 0.5                # global speed cap — raise as confidence grows
    control_hz: 50.0

gamepad_teleop:
  ros__parameters:
    joy_topic: '/joy'
    drive_topic: '/drive'
    # DualSense Wireless Controller button layout
    deadman_button: 4             # L1  — must hold for any motion
    turbo_button: 5               # R1  — raises speed limit to max_speed
    estop_button: 0               # Cross (×) — latching e-stop
    # DualSense axis layout (as reported by ros2 joy_node)
    #   0: left stick X  (-1=right, +1=left)
    #   1: left stick Y  (+1=forward/up)
    #   2: right stick X
    #   3: L2 trigger    (rest=+1, full pull=-1)
    #   4: R2 trigger    (rest=+1, full pull=-1)
    #   5: right stick Y
    throttle_axis: 1              # left stick Y (+1 forward)
    steer_axis: 0                 # left stick X (+1 left)
    brake_axis: 4                 # R2 trigger
    brake_invert: true            # DualSense triggers rest at +1, not -1
    # Speed limits (start conservative — raise after successful test laps)
    safe_speed: 2.0               # m/s without turbo
    max_speed: 4.0                # m/s with turbo (R1) held
    max_steer: 0.41               # rad — match drive_node max_steer
    steer_gain: 1.0               # scale 0–1 to reduce steering sensitivity
    publish_hz: 20.0
